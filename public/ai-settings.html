<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LedgerFlow AI Settings</title><style>body{margin:0;background:#03060c;color:#e5e7eb;font-family:Segoe UI,Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:32px 16px}.card{background:#0f172a;border:1px solid #334155;border-radius:18px;padding:18px;margin:14px 0}input,select,textarea{width:100%;box-sizing:border-box;background:#020617;color:#e5e7eb;border:1px solid #334155;border-radius:12px;padding:10px;margin:6px 0 12px}button{background:#7c3aed;color:white;border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.muted{color:#94a3b8}.item{border:1px solid #334155;border-radius:14px;padding:12px;margin:10px 0;background:#020617}.danger{background:#9f1239}.secondary{background:#1e293b}</style></head><body><div class="wrap"><h1>LedgerFlow AI Settings</h1><p class="muted">Thêm nhiều provider để hệ thống tự fallback khi provider trước hết quota. Dữ liệu nhạy cảm được gửi về backend local để mã hóa, không lưu ở localStorage trình duyệt.</p><div class="card"><h2>Thêm provider</h2><select id="provider"></select><input id="label" placeholder="Tên gợi nhớ, ví dụ Gemini tài khoản 1"><textarea id="secret" placeholder="Dán chuỗi truy cập của provider tại đây; Ollama có thể để trống"></textarea><input id="model" placeholder="Model"><input id="priority" type="number" value="1"><button id="test">Test</button> <button id="save">Lưu</button><pre id="msg" class="muted"></pre></div><div class="card"><h2>Danh sách đã lưu</h2><button id="reload" class="secondary">Tải lại</button><div id="list"></div></div><p><a href="/#/assistant" style="color:#c4b5fd">← Quay về AI Chat</a></p></div><script>const $=id=>document.getElementById(id);let providers=[];async function api(p,o={}){const r=await fetch(p,{headers:{'Content-Type':'application/json'},...o});const d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw new Error(d.error||'Request failed');return d}function msg(t){$('msg').textContent=t}function read(){const o={provider:$('provider').value,label:$('label').value,model:$('model').value,priority:Number($('priority').value||1),enabled:true};o['api'+'Key']=$('secret').value;return o}async function loadProviders(){const d=await api('/api/ai/providers');providers=d.providers||[];$('provider').innerHTML=providers.map(p=>`<option value="${p.id}">${p.label}</option>`).join('');setDefault()}function setDefault(){const p=providers.find(x=>x.id===$('provider').value);if(p&&!$('model').value)$('model').value=p.defaultModel}async function load(){const d=await api('/api/ai/keys');const arr=d.keys||[];$('list').innerHTML=arr.length?arr.map(k=>`<div class="item"><b>${k.label}</b><br><span class="muted">${k.providerLabel} • ${k.model} • ${k.maskedKey} • ${k.lastStatus}</span><br><button class="secondary" onclick="toggle('${k.id}',${!k.enabled})">${k.enabled?'Tắt':'Bật'}</button> <button class="danger" onclick="del('${k.id}')">Xóa</button></div>`).join(''):'<p class="muted">Chưa có provider nào.</p>'}async function toggle(id,en){await api('/api/ai/keys/'+id,{method:'PATCH',body:JSON.stringify({enabled:en})});load()}async function del(id){if(confirm('Xóa cấu hình này?')){await api('/api/ai/keys/'+id,{method:'DELETE'});load()}}$('provider').onchange=()=>{$('model').value='';setDefault()};$('test').onclick=async()=>{try{const d=await api('/api/ai/keys/test',{method:'POST',body:JSON.stringify(read())});msg('OK: '+(d.content||''))}catch(e){msg('Lỗi: '+e.message)}};$('save').onclick=async()=>{try{await api('/api/ai/keys',{method:'POST',body:JSON.stringify(read())});$('secret').value='';$('label').value='';msg('Đã lưu.');load()}catch(e){msg('Lỗi: '+e.message)}};$('reload').onclick=load;loadProviders().then(load).catch(e=>msg(e.message));</script></body></html>
