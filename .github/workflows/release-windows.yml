name: Build LedgerFlow Hub Windows Setup

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v0.1.0-windows"
        required: true
        default: "v0.1.0-windows"
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-setup:
    name: Build Windows setup exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate desktop release readiness
        run: npm run check:hybrid

      - name: Build Windows setup and portable exe
        run: npm run desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List generated release files
        shell: pwsh
        run: |
          if (-not (Test-Path release)) {
            throw "Missing release folder. electron-builder did not create output."
          }
          Get-ChildItem release -Recurse | Select-Object FullName, Length
          $exeFiles = Get-ChildItem release -Filter *.exe -Recurse
          if ($exeFiles.Count -eq 0) {
            throw "No .exe setup/portable file was generated in release/."
          }

      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: LedgerFlow-Hub-Windows-Setup
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30

      - name: Resolve release tag
        id: release_tag
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: LedgerFlow Hub Windows ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
