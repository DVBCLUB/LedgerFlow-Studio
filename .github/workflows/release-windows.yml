name: Build LedgerFlow Hub Windows Setup

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v0.1.0-windows"
        required: true
        default: "v0.1.0-windows"
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-setup:
    name: Build Windows setup exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run release readiness checks as warnings
        shell: pwsh
        run: |
          npm run check:hybrid
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Release readiness checks reported issues, but Windows setup packaging will continue. Fix these warnings after producing a testable installer."
            exit 0
          }

      - name: Build production app without prebuild gate
        shell: pwsh
        run: |
          npm run prepare:icons
          npx vite build
          npx esbuild server.ts --bundle --platform=node --format=cjs --packages=external --sourcemap --outfile=dist/server.cjs
          npm run build:manifest
          npm run check:build

      - name: Build Windows setup and portable exe
        run: npx electron-builder
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List generated release files
        shell: pwsh
        run: |
          if (-not (Test-Path release)) {
            throw "Missing release folder. electron-builder did not create output."
          }
          Get-ChildItem release -Recurse | Select-Object FullName, Length
          $exeFiles = Get-ChildItem release -Filter *.exe -Recurse
          if ($exeFiles.Count -eq 0) {
            throw "No .exe setup/portable file was generated in release/."
          }
          "Generated Windows exe files:"
          $exeFiles | ForEach-Object { "- $($_.FullName) ($($_.Length) bytes)" }

      - name: Validate release artifacts as warnings
        shell: pwsh
        run: |
          npm run check:release
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Release artifact check reported issues, but generated files will still be uploaded for manual testing."
            exit 0
          }

      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: LedgerFlow-Hub-Windows-Setup
          path: |
            release/**/*.exe
            release/**/*.blockmap
            release/**/*.yml
          if-no-files-found: error
          retention-days: 30

      - name: Resolve release tag
        id: release_tag
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: LedgerFlow Hub Windows ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/**/*.exe
            release/**/*.blockmap
            release/**/*.yml
