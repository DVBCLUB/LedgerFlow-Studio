name: LedgerFlow Release Guard

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "server.ts"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/release-guard.yml"
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "server.ts"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/release-guard.yml"

jobs:
  release-guard:
    name: Build / Simulation / Founder Labs Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Environment configuration check
        run: npm run check:env

      - name: Simulation registry integrity check
        run: npm run check:simulations

      - name: Founder Labs integrity check
        run: npm run check:founder-labs

      - name: TypeScript check
        run: npm run lint

      - name: Production build smoke check
        run: npm run build

      - name: Runtime API smoke check
        run: npm run check:runtime
