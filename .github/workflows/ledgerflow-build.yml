name: LedgerFlow Build Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript lint
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee typecheck.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload typecheck log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ledgerflow-build-typecheck-log
          path: typecheck.log
          if-no-files-found: ignore

      - name: Unit tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee unit-test.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload unit test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ledgerflow-build-unit-test-log
          path: unit-test.log
          if-no-files-found: ignore

      - name: Build app and daemon
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ledgerflow-build-verification-log
          path: build.log
          if-no-files-found: ignore

      - name: Desktop package check
        run: npm run check:desktop
