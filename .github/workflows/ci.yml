name: LedgerFlow Studio CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  typecheck-and-build:
    name: Type-check and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee typecheck.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload typecheck log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-log
          path: typecheck.log
          if-no-files-found: ignore

      - name: Unit tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee unit-test.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload unit test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ledgerflow-ci-unit-test-log
          path: unit-test.log
          if-no-files-found: ignore

      - name: Build web/server bundle
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ledgerflow-ci-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Runtime API smoke test
        shell: bash
        run: |
          set +e
          npm run check:runtime 2>&1 | tee runtime-smoke.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload runtime smoke log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ledgerflow-runtime-smoke-log
          path: runtime-smoke.log
          if-no-files-found: ignore

      - name: Upload dist artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ledgerflow-dist
          path: dist/
          if-no-files-found: error
