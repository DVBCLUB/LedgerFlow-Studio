name: LedgerFlow Studio CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  typecheck-and-build:
    name: Type-check and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build web/server bundle
        run: npm run build

      - name: Runtime API smoke test
        run: npm run check:runtime

      - name: Upload dist artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ledgerflow-dist
          path: dist/
          if-no-files-found: error
