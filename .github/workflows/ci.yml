name: LedgerFlow Studio CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  typecheck-and-build:
    name: Type-check and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: CODEMAP discipline guard
        run: npm run check:codemap

      - name: Lint (safety gate)
        run: npm run lint

      - name: Type-check strict (tsc --noEmit)
        run: npm run lint:strict

      - name: Unit tests
        run: npm test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ledgerflow-ci-test-results
          path: test_suites/
          if-no-files-found: ignore

      - name: Build web/server bundle
        run: npm run build

      - name: Upload build output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ledgerflow-ci-build-log
          path: dist/
          if-no-files-found: ignore

      - name: Runtime API smoke test
        shell: bash
        run: |
          set +e
          npm run check:runtime 2>&1 | tee runtime-smoke.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload runtime smoke log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ledgerflow-runtime-smoke-log
          path: runtime-smoke.log
          if-no-files-found: ignore

      - name: Upload dist artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ledgerflow-dist
          path: dist/
          if-no-files-found: error
