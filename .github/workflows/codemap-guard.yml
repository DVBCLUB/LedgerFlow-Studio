name: CODEMAP Discipline Guard

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  codemap-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run CODEMAP discipline guard
        env:
          CODEMAP_GUARD_STRICT: "false"
        run: node scripts/check-codemap-discipline.mjs
