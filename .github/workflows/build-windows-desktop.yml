name: Build Windows Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Prepare desktop icon
        run: npm run prepare:icons

      - name: Build Vite web bundle
        run: npx vite build

      - name: Bundle Node server
        run: npx esbuild server.ts --bundle --platform=node --format=cjs --packages=external --sourcemap --outfile=dist/server.cjs

      - name: Write build manifest
        run: npm run build:manifest

      - name: Build desktop setup and portable exe
        run: npx electron-builder --publish never -c.asar=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List generated release files
        shell: pwsh
        run: |
          if (-not (Test-Path release)) {
            throw "Missing release folder. electron-builder did not create output."
          }
          Get-ChildItem release -Recurse | Select-Object FullName, Length
          $exeFiles = Get-ChildItem release -Filter *.exe -Recurse
          if ($exeFiles.Count -eq 0) {
            throw "No .exe setup/portable file was generated in release/."
          }
          "Generated Windows exe files:"
          $exeFiles | ForEach-Object { "- $($_.FullName) ($($_.Length) bytes)" }

      - name: Upload release folder
        uses: actions/upload-artifact@v4
        with:
          name: LedgerFlow-Hub-Windows-release
          path: |
            release/**/*.exe
            release/**/*.blockmap
            release/**/*.yml
          if-no-files-found: error
