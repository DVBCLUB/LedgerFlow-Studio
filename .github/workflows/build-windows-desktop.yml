name: Build Windows Desktop

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Regenerate desktop icon
        run: npm run prepare:icons

      - name: Build Vite web bundle
        run: npx vite build

      - name: Bundle Node server
        run: npx esbuild server.ts --bundle --platform=node --format=cjs --packages=external --sourcemap --outfile=dist/server.cjs

      - name: Write build manifest
        run: npm run build:manifest

      - name: Ensure desktop icon exists
        shell: pwsh
        run: |
          if (-not (Test-Path build\icon.ico)) {
            throw "Missing build/icon.ico. npm run prepare:icons did not create the desktop icon."
          }
          "Desktop build resources:"
          Get-ChildItem build -ErrorAction SilentlyContinue | Select-Object FullName, Length

      - name: Build desktop unpacked Windows app
        run: npx electron-builder@24.13.3 --publish never --config.asar=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Prepare user download package
        shell: pwsh
        run: |
          if (-not (Test-Path release)) {
            throw "Missing release folder. electron-builder did not create output."
          }

          "Electron builder release output:"
          Get-ChildItem release -Recurse | Select-Object FullName, Length

          $appDir = Join-Path "release" "win-unpacked"
          $appExe = Join-Path $appDir "LedgerFlow Hub.exe"
          if (-not (Test-Path $appDir)) {
            throw "Missing release/win-unpacked. The Windows workflow expects package.json win.target to include dir."
          }
          if (-not (Test-Path $appExe)) {
            throw "Missing LedgerFlow Hub.exe inside release/win-unpacked. Refusing to upload a debug-only artifact."
          }

          $appBytes = (Get-ChildItem $appDir -Recurse -File | Measure-Object -Property Length -Sum).Sum
          if ($appBytes -lt 10000000) {
            throw "Windows app payload is suspiciously small ($appBytes bytes). Refusing to upload broken artifact."
          }

          New-Item -ItemType Directory -Force -Path windows-download | Out-Null
          Copy-Item $appDir (Join-Path "windows-download" "LedgerFlow Hub") -Recurse -Force
          @'
          LedgerFlow Hub - Windows App

          Day la goi tai danh cho nguoi dung Windows.

          Cach dung:
          1. Giai nen artifact zip nay.
          2. Mo thu muc LedgerFlow Hub.
          3. Bam LedgerFlow Hub.exe de chay ung dung.
          4. Neu Windows hien SmartScreen, chon More info > Run anyway.

          Luu y:
          - Day KHONG phai source code zip.
          - Day la ban Windows unpacked app folder, khong phai installer.
          - Neu muon code/sua app, hay dung repo GitHub.
          '@ | Set-Content -Encoding UTF8 windows-download\START_HERE.txt

          "Generated user download package:"
          Get-ChildItem windows-download -Recurse | Select-Object FullName, Length

      - name: Upload Windows user download zip
        uses: actions/upload-artifact@v7
        with:
          name: LedgerFlow-Hub-Windows-Download
          path: windows-download/**/*
          if-no-files-found: error
