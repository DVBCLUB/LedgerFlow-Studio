name: Build Windows Desktop

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Regenerate desktop icon
        run: npm run prepare:icons

      - name: Build Vite web bundle
        run: npx vite build

      - name: Bundle Node server
        run: npx esbuild server.ts --bundle --platform=node --format=cjs --packages=external --sourcemap --outfile=dist/server.cjs

      - name: Write build manifest
        run: npm run build:manifest

      - name: Ensure desktop icon exists
        shell: pwsh
        run: |
          if (-not (Test-Path build\icon.ico)) {
            throw "Missing build/icon.ico. npm run prepare:icons did not create the desktop icon."
          }
          "Desktop build resources:"
          Get-ChildItem build -ErrorAction SilentlyContinue | Select-Object FullName, Length

      - name: Build desktop setup and portable exe
        run: npx electron-builder@24.13.3 --publish never --config.asar=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Prepare user download package
        shell: pwsh
        run: |
          if (-not (Test-Path release)) {
            throw "Missing release folder. electron-builder did not create output."
          }
          $exeFiles = Get-ChildItem release -Filter *.exe -Recurse
          if ($exeFiles.Count -eq 0) {
            throw "No .exe setup/portable file was generated in release/."
          }
          New-Item -ItemType Directory -Force -Path windows-download | Out-Null
          Copy-Item release\*.exe windows-download\ -Force
          if (Test-Path release\*.blockmap) { Copy-Item release\*.blockmap windows-download\ -Force }
          if (Test-Path release\*.yml) { Copy-Item release\*.yml windows-download\ -Force }
          @'
          LedgerFlow Hub - Windows App

          Day la goi tai danh cho nguoi dung Windows.

          Cach dung:
          1. Giai nen file zip nay.
          2. Bam file .exe ben trong de mo/cai dat LedgerFlow Hub.
          3. Neu Windows hien SmartScreen, chon More info > Run anyway.

          Luu y:
          - Day KHONG phai source code zip.
          - Neu muon code/sua app, hay dung repo GitHub.
          - Neu muon chi su dung app, chi can file .exe trong thu muc nay.
          '@ | Set-Content -Encoding UTF8 windows-download\START_HERE.txt
          "Generated user download package:"
          Get-ChildItem windows-download | Select-Object Name, Length

      - name: Upload Windows user download zip
        uses: actions/upload-artifact@v4
        with:
          name: LedgerFlow-Hub-Windows-Download
          path: windows-download/**/*
          if-no-files-found: error
