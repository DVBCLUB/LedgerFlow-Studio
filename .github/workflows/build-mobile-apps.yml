name: Build Mobile Apps (iOS & Android)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/build-mobile-apps.yml'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build:web

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: LedgerFlow-Vibe-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS Native Project (Xcode)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build:web

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Package iOS Project Archive
        run: |
          tar -czf LedgerFlow-iOS-Xcode-Project.tar.gz ios/

      - name: Upload iOS Xcode Project Bundle
        uses: actions/upload-artifact@v4
        with:
          name: LedgerFlow-Vibe-iOS-Package
          path: LedgerFlow-iOS-Xcode-Project.tar.gz
          if-no-files-found: error
